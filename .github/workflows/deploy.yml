name: Deploy to Production EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set server variables
        run: |
          if [ "${{ matrix.server }}" == "1" ]; then
            echo "HOST=${{ secrets.EC2_HOST_1 }}" >> $GITHUB_ENV
            echo "KEY_CONTENT<<EOF" >> $GITHUB_ENV
            echo "${{ secrets.EC2_SSH_KEY_1 }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "HOST=${{ secrets.EC2_HOST_2 }}" >> $GITHUB_ENV
            echo "KEY_CONTENT<<EOF" >> $GITHUB_ENV
            echo "${{ secrets.EC2_SSH_KEY_2 }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HOST }}
          username: ubuntu
          key: ${{ env.KEY_CONTENT }}
          script: |
            cd ecommerce_website
            git pull origin main --rebase
            
            # 1. Build and restart Spring Boot Backend
            cd backend
            ./mvnw clean package -DskipTests
            pkill -f 'java -jar' || true
            nohup java -jar target/*.jar > app.log 2>&1 </dev/null &
            sleep 3
            
            # 2. Build and update React Frontend
            cd ../frontend
            npm run build
            sudo cp -r dist/* /var/www/html/
            sudo systemctl daemon-reload
            sudo systemctl reload nginx